apiVersion: apps/v1
kind: Deployment
metadata:
  name: jungle
spec:
  replicas: 2

  selector:
    matchLabels:
      app: jungle

  template:
    metadata:
      labels:
        app: jungle

    spec:
      containers:
        - name: jungle
          image: l1srv2vksimg.bajajlife.com/bajajlife/nginx:stable-alpine

          ports:
            - containerPort: 80

          volumeMounts:
            - name: website
              mountPath: /usr/share/nginx/html

      volumes:
        - name: website
          configMap:
            name: jungle-html
